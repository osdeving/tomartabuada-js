<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1024" />
    <title>Sem conexão · Cálculo Mental</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080b18;
        color: #f8fafc;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 15% 5%, rgba(23, 201, 212, 0.2), transparent 34rem),
          radial-gradient(circle at 90% 92%, rgba(251, 93, 168, 0.17), transparent 30rem),
          #080b18;
      }
      main {
        width: min(100%, 430px);
        padding: 32px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 28px;
        background: rgba(17, 23, 46, .86);
        box-shadow: 0 24px 70px rgba(0,0,0,.35);
        text-align: center;
      }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { margin: 22px 0 10px; font-size: clamp(1.65rem, 7vw, 2.2rem); }
      p { margin: 0 0 26px; color: #cbd5e1; line-height: 1.55; }
      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 16px;
        background: linear-gradient(120deg, #17c9d4, #8b5cf6);
        color: #fff;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #ffb224; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="./icons/app-icon.svg" alt="" width="88" height="88" />
      <h1>Você está offline</h1>
      <p>Seus treinos já carregados continuam disponíveis. Reconecte-se para buscar conteúdo novo e tente novamente.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
